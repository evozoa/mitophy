name: pipeline
on:
  schedule:
    - cron: "17 4 3 * *"          # monthly, 3rd day 04:17 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: pipeline profile
        type: choice
        default: ci
        options: [ci, quick]
      force:
        description: ignore cached results and rerun every stage
        type: boolean
        default: false
concurrency:
  group: mitophy-pipeline
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash
      - name: RefSeq release stamp (for cache key)
        id: stamp
        shell: bash -l {0}
        run: |
          lm=$(curl -sI https://ftp.ncbi.nlm.nih.gov/refseq/release/mitochondrion/mitochondrion.1.genomic.gbff.gz | grep -i '^last-modified' | tr -d '\r' | cut -d' ' -f2- | tr ' ,:' '___')
          echo "lm=${lm:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            work/mito
            work/bact
          key: mitophy-work-${{ steps.stamp.outputs.lm }}-${{ hashFiles('config/markers.yml', 'config/taxa_origin.yml') }}
          restore-keys: mitophy-work-
      - name: Run pipeline
        shell: bash -l {0}
        run: |
          mitophy all --profile ${{ inputs.profile || 'ci' }} ${{ (inputs.force && '--force') || '' }} --threads 4
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          retention-days: 30
          if-no-files-found: ignore
          path: |
            work/**/*.log
            work/**/*.iqtree
            work/origin/hits.tsv
            work/mito/unmatched_products.tsv
      - name: Commit results
        id: commit
        shell: bash          # non-login shell on purpose: `bash -l` runs ~/.bash_logout on exit, which breaks `set -e` exit codes
        run: |
          set -euo pipefail
          git config user.name "mitophy-bot"
          git config user.email "mitophy-bot@users.noreply.github.com"
          profile="${{ inputs.profile || 'ci' }}"
          for attempt in 1 2 3; do
            # replay fresh results on top of the current main (other commits may have landed while we ran)
            tmp=$(mktemp -d); cp -r results "$tmp/results"
            git fetch origin main && git reset -q --hard origin/main
            rm -rf results && cp -r "$tmp/results" results
            "$MAMBA_EXE" run -n mitophy mitophy provenance --profile "$profile"   # regenerate run record + CHANGELOG entry on top of the fresh CHANGELOG
            git add results CHANGELOG.md
            # commit only when scientific content changed (trees, alignments, tables, charts) — run metadata alone (dates, runtimes) is not worth a commit
            if git diff --cached --quiet -- 'results/*/tree.nwk' 'results/*/partitions.nex' 'results/*/occupancy.tsv' 'results/*/concat.faa.gz' 'results/*/genomes.tsv' 'results/*/stats_by_group.tsv' 'results/*/charts/*.svg' 'results/*/hits*.tsv'; then
              echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no changes in trees/tables — nothing committed"; git reset -q --hard origin/main; exit 0
            fi
            git commit -q -m "pipeline: run $(date -u +%F) [skip ci]"
            if git push origin HEAD:main; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "push rejected (attempt $attempt), retrying"; sleep 15
          done
          echo "could not push results" >&2; exit 1
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash
      - name: Build site
        shell: bash -l {0}
        run: mitophy site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
