name: pipeline
on:
  schedule:
    - cron: "17 4 3 * *"          # monthly, 3rd day 04:17 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: pipeline profile
        type: choice
        default: ci
        options: [ci, quick]
      force:
        description: ignore cached results and rerun every stage
        type: boolean
        default: false
concurrency:
  group: mitophy-pipeline
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash
      - name: RefSeq release stamp (for cache key)
        id: stamp
        shell: bash -l {0}
        run: |
          lm=$(curl -sI https://ftp.ncbi.nlm.nih.gov/refseq/release/mitochondrion/mitochondrion.1.genomic.gbff.gz | grep -i '^last-modified' | tr -d '\r' | cut -d' ' -f2- | tr ' ,:' '___')
          echo "lm=${lm:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            work/mito
            work/bact
          key: mitophy-work-${{ steps.stamp.outputs.lm }}-${{ hashFiles('config/markers.yml', 'config/taxa_origin.yml') }}
          restore-keys: mitophy-work-
      - name: Run pipeline
        shell: bash -l {0}
        run: |
          mitophy all --profile ${{ inputs.profile || 'ci' }} ${{ (inputs.force && '--force') || '' }} --threads 4
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          retention-days: 30
          if-no-files-found: ignore
          path: |
            work/**/*.log
            work/**/*.iqtree
            work/origin/hits.tsv
            work/mito/unmatched_products.tsv
      - name: Commit results
        id: commit
        shell: bash -l {0}
        run: |
          git config user.name "mitophy-bot"
          git config user.email "mitophy-bot@users.noreply.github.com"
          git add results CHANGELOG.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no result changes"
          else
            git commit -m "pipeline: run $(date -u +%F) [skip ci]"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash
      - name: Build site
        shell: bash -l {0}
        run: mitophy site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
