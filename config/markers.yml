# Marker genes for the two analyses.
#   id         canonical (mito) gene id used in filenames
#   synonyms   /gene and /product values in RefSeq mito GenBank records (matched after normalisation, see extract_mito.py)
#   bact       bacterial homolog: product-name regexes (case-insensitive) used to pick seed sequences from RefSeq proteomes;
#              the per-marker HMM is then built from mito + bacterial seeds and searched against every proteome
#   use        which analyses use the marker: origin (mito + bacteria), diversification (mito only)
# nad<n> <-> nuo mapping follows Lang et al. 1997 / Gray 2012 (nad7=NuoD, nad8=NuoI, nad9=NuoC, nad10=NuoE, nad11=NuoG).
markers:
  - id: cox1
    synonyms: [cox1p, cox1, coi, co1, coxi, cox-1, mt-co1, "cytochrome c oxidase subunit 1", "cytochrome c oxidase subunit i", "cytochrome oxidase subunit 1", "cytochrome oxidase subunit i", "cytochrome c oxidase subunit1"]
    bact: {product: ["cytochrome c oxidase subunit I$", "cytochrome c oxidase subunit 1$", "cytochrome-c oxidase subunit I", "^cytochrome c oxidase subunit I,", "\\bctaD\\b", "\\bcoxA\\b"], paralogs: "heme-copper oxidase family (cyoB, qoxB, ccoN, cbb3-type) — best hit + margin check"}
    use: [origin, diversification]
  - id: cox2
    synonyms: [cox2p, cox2, coii, co2, coxii, cox-2, mt-co2, "cytochrome c oxidase subunit 2", "cytochrome c oxidase subunit ii", "cytochrome oxidase subunit 2", "cytochrome oxidase subunit ii"]
