# Taxa for the origin-of-mitochondria analysis.
# mito: matched against RefSeq mitochondrial records by exact organism name (or accession if given).
#       Preference given to gene-rich protist genomes; a few animals/fungi/plants for context.
# bacteria: name -> RefSeq assembly (GCF) resolved by scripts/refresh_bacterial_accessions.py
#       (reference/representative, complete genome preferred). Grouping is for display only; the lineage
#       from NCBI is used for colouring.
